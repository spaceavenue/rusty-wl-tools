[build]
target = "x86_64-unknown-linux-musl"

[unstable]
build-std = ["std", "panic_abort"]
build-std-features = ["optimize_for_size"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-Wl,-z,stack-size=1024", "-Z", "location-detail=none", "-Z", "fmt-debug=none", "--remap-path-prefix=$(pwd)=.", "--remap-path-prefix=$HOME/.local/lib/cargo="]
